<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Domestic Violences</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .main {
        background: linear-gradient(135deg, #1a1a1a 0%, #cc0000 50%, #ffffff 100%);
        background-repeat: repeat-y;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        position: relative;
    }
.slider{
    position: relative;
    width:200px;
    height:320px;
    transform-style: preserve-3d;
    animation: rotate 30s linear infinite;
}

@keyframes rotate{
    0%{
        transform:perspective(1000px) rotatey(0deg);
    }

    100% {
        transform:perspective(1000px) rotatey(360deg);
    }
}

.slider span{
    position: absolute;
    left:0;
    top:0;
    height:100%;
    width:100%;
    transform-origin: center;
    transform-style: preserve-3d;
    transform:rotatey(calc(var(--i)*72deg)) translatez(206px);
}

 .slider span img{
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border-radius: 40px;
    object-fit: cover;
    transition:2s;
} 
.slider span:hover img{
    transform:translatey(-50px) scale(1.2); 
} 

.about{
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width:min(1400px,160vh);
}
h2{
    margin-bottom: 6px;
}
.about h2, p{
    text-align: center;
    line-height: 20px;
}

 .pro {
    width: 150px;
    height:35px;
    padding: 0px 20px;
    text-decoration: none;
    background: linear-gradient(135deg, #1a1a1a 0%, #cc0000 50%, #ffffff 100%);
    backdrop-filter: blur(8px);
    border:none;
    border-radius: 30px;
    font-weight:bold;
    font-size: 14px;
    color:white;
   display: flex;
   align-items: center;
   justify-content: center;
    margin:0 auto;
   margin-bottom:9px;
}

.nav-back {
    position: fixed;
    top: 20px;
    left: 20px;
    text-decoration: none;
    color: #ffffff;
    font-weight: bold;
    font-size: 16px;
    padding: 10px 15px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 5px;
    transition: all 0.3s ease;
    z-index: 100;
}

.nav-back:hover {
    background: rgba(0, 0, 0, 0.9);
    transform: translateX(-5px);
}
@media(max-width:575px){
    .about{
        margin:15px;
        padding:10px;
    }
}
</style>

<body>
    <div class="main"> 
    <a href="../sarah perspective/sarahNews.html" class="nav-back">← Back to Home</a>
    <div class="slider">
        <span style="--i:1;"><img src="img1.jpeg"></span>
        <span style="--i:2;"><img src="img2.jpeg"></span>
        <span style="--i:3;"><img src="img3.jpeg"></span>
        <span style="--i:4;"><img src="img4.jpeg"></span>
        <span style="--i:5;"><img src="img5.jpeg"></span>
    </div>
    
    <div class="about">
        <h2>Awareness & Action</h2>
        <p>Domestic violence is a serious issue. Education and awareness create safer communities.</p>
        <a href="../Domestic violence/domestic.html" class="pro">🔗 Learn More</a>
    </div>
    </div>
</body>
